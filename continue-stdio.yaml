# .continue/mcpServers/heliograph-local.yaml
#
# Continue.dev MCP configuration for Heliograph — LOCAL / STDIO mode.
# Use this when you want to run Heliograph's MCP server as a subprocess
# without a running web server.
#
# Continue will spawn `python -m src.mcp_server` and communicate via stdio.
#
# Prerequisites:
#   - Heliograph repo cloned locally
#   - Python environment with dependencies installed
#   - .env file configured with API_BASE_URL and API_KEY
#
# Adjust `cwd` to point to your heliograph directory.

name: Heliograph (local)
version: 0.1.0
schema: v1

mcpServers:
  - name: Heliograph
    command: python
    args:
      - "-m"
      - "src.mcp_server"
    cwd: /path/to/heliograph
    env:
      PYTHONPATH: /path/to/heliograph
