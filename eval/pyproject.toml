[project]
name = "heliograph-eval"
version = "0.1.0"
description = "Eval harness for Heliograph — measure real-world impact"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.20",          # HF datasets (benchmarks)
  "huggingface_hub>=0.24",
  # multiprocess 0.70.16+ ships an RLock shutdown bug on Python 3.12.
  # The 0.70.15 line is the last known-good for our usage (sequential anyway).
  "multiprocess>=0.70.15,<0.70.17 ; python_version >= '3.12'",
  "pyyaml>=6.0",
  "rich>=13.7",              # pretty console output
  "tqdm>=4.66",
  "httpx>=0.27",
  "mcp>=0.9",                # MCP Python SDK for raw_mcp adapter
  "ragas>=0.1.20",           # answer faithfulness scoring
  "rank-bm25>=0.2.2",        # baseline retrieval comparator
  "anthropic>=0.40",         # claude-code adapter + LLM judge
  "openai>=1.40",            # OpenAI-compat judge / aider integration
]

[project.optional-dependencies]
swebench = ["swebench>=2.0"]   # full SWE-bench harness, heavy
dev      = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness", "harness.agent_adapters", "benchmarks"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
